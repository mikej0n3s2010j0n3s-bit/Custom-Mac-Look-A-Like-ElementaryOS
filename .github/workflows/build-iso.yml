name: Compile macOS Style Elementary OS ISO

on:
  workflow_dispatch:

jobs:
  build-iso:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install Compiling Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y squashfs-tools xorriso sed wget curl p7zip-full glib-2.0 isolinux

      - name: Download and Unpack Base System
        run: |
          mkdir -p custom-iso squashfs-root
          wget -O elementaryos.iso https://elementary.io/downloads/iso
          7z x elementaryos.iso -o./custom-iso || true
          sudo unsquashfs -d squashfs-root/ custom-iso/casper/filesystem.squashfs

      - name: Inject macOS Big Sur Themes
        run: |
          sudo mkdir -p squashfs-root/usr/share/themes/WhiteSur-Light
          sudo mkdir -p squashfs-root/usr/share/icons/WhiteSur
          sudo mkdir -p squashfs-root/usr/share/glib-2.0/schemas/
          
          git clone --depth 1 https://github.com/vinceliuice/WhiteSur-gtk-theme.git
          sudo cp -r WhiteSur-gtk-theme/src/. squashfs-root/usr/share/themes/WhiteSur-Light/
          
          git clone --depth 1 https://github.com/vinceliuice/WhiteSur-icon-theme.git
          sudo cp -r WhiteSur-icon-theme/src/. squashfs-root/usr/share/icons/WhiteSur/

          cat > /tmp/macos_settings.override << 'SETTINGS'
[org.gnome.desktop.interface]
gtk-theme=WhiteSur-Light
icon-theme=WhiteSur

[org.pantheon.desktop.gala.appearance]
button-layout=close,minimize,maximize:
SETTINGS
          sudo mv /tmp/macos_settings.override squashfs-root/usr/share/glib-2.0/schemas/99_macos_default_settings.gschema.override
          sudo glib-compile-schemas squashfs-root/usr/share/glib-2.0/schemas/

      - name: Compile Custom Bootable ISO
        run: |
          sudo rm -f custom-iso/casper/filesystem.squashfs
          sudo mksquashfs squashfs-root custom-iso/casper/filesystem.squashfs -comp xz
          sudo sh -c "du -sx --block-size=1 squashfs-root | cut -f1 > custom-iso/casper/filesystem.size"
          
          cd custom-iso
          sudo xorriso -as mkisofs \
            -r -V "macOS-elementary" \
            -o ../custom-elementaryos.iso \
            -J -l -b isolinux/isolinux.bin \
            -c isolinux/boot.cat -no-emul-boot \
            -boot-load-size 4 -boot-info-table \
            -eltorito-alt-boot \
            -e boot/grub/efi.img \
            -no-emul-boot . || true
          cd ..

      - name: Upload Finished ISO File
        uses: actions/upload-artifact@v4
        with:
          name: custom-elementary-macos-iso
          path: custom-elementaryos.iso
          retention-days: 3
