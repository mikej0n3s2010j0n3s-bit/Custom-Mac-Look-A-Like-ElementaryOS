name: Compile macOS Style Elementary OS ISO

on:
  workflow_dispatch: # Allows you to manually trigger the build with a button click

jobs:
  build-iso:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install Compiling Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y squashfs-tools xorriso sed wget curl p7zip-full glib-2.0

      - name: Download and Unpack Base System
        run: |
          mkdir -p custom-iso squashfs-root
          # Use an automated mirror to grab the 3GB base system securely
          curl -L -o elementaryos.iso https://gigenet.com
          7z x elementaryos.iso -o./custom-iso
          sudo unsquashfs -d squashfs-root/ custom-iso/casper/filesystem.squashfs

      - name: Inject macOS Big Sur Themes
        run: |
          sudo mkdir -p squashfs-root/usr/share/themes squashfs-root/usr/share/icons squashfs-root/usr/share/glib-2.0/schemas/
          
          # Pull WhiteSur UI skins
          git clone https://github.com
          sudo ./WhiteSur-gtk-theme/install.sh -d "squashfs-root/usr/share/themes"
          git clone https://github.com
          sudo ./WhiteSur-icon-theme/install.sh -d "squashfs-root/usr/share/icons"

          # Configure global UI layout variables (Buttons on left side)
          cat << 'EOF' | sudo tee squashfs-root/usr/share/glib-2.0/schemas/99_macos_default_settings.gschema.override
          [org.gnome.desktop.interface]
          gtk-theme='WhiteSur-Light'
          icon-theme='WhiteSur'
          cursor-theme='WhiteSur-cursors'
          [org.pantheon.desktop.gala.appearance]
          button-layout='close,minimize,maximize:'
          EOF
          
          # Compile the configurations
          sudo glib-compile-schemas squashfs-root/usr/share/glib-2.0/schemas/

      - name: Compile Custom Bootable ISO
        run: |
          sudo rm -f custom-iso/casper/filesystem.squashfs
          sudo mksquashfs squashfs-root custom-iso/casper/filesystem.squashfs -comp xz
          sudo sh -c "du -sx --block-size=1 squashfs-root | cut -f1 > custom-iso/casper/filesystem.size"
          
          cd custom-iso
          sudo xorrcodec=disabled xorriso -as mkisofs \
            -r -V "macOS-elementary" \
            -o ../custom-elementaryos.iso \
            -J -l -b isolinux/isolinux.bin \
            -c isolinux/boot.cat -no-emul-boot \
            -boot-load-size 4 -boot-info-table \
            -eltorito-alt-boot \
            -e boot/grub/efi.img \
            -no-emul-boot .
          cd ..

      - name: Upload Finished ISO File
        uses: actions/upload-artifact@v4
        with:
          name: custom-elementary-macos-iso
          path: custom-elementaryos.iso
          retention-days: 3
